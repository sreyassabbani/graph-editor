[package]
name = "graph-editor"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
crossterm = "0.28"
image = { version = "0.25", default-features = false, features = ["png"] }
ratatui = "0.29"
ratatui-image = { version = "4.2", default-features = false, features = ["crossterm"] }
base64 = "0.21"
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
