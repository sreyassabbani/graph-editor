[package]
name = "petersen"
version = "0.1.0"
edition = "2021"
description = "Mouse-first terminal graph editor that exports Typst/Fletcher drawings"
repository = "https://github.com/sreyassabbani/petersen"

[dependencies]
anyhow = "1"
crossterm = "0.28"
image = { version = "0.25", default-features = false, features = ["png"] }
ratatui = "0.29"
ratatui-image = { version = "4.2", default-features = false, features = ["crossterm"] }
base64 = "0.21"
fdeflate = "0.3"
miniz_oxide = "0.8"
libc = "0.2"
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }

# Mostly dependency code: whole-program optimization drops what the editor
# never calls (5.4 MB -> 3.1 MB). Rendering speed is unchanged; it stays at
# opt-level 3; panics still unwind so the terminal is restored on the way out.
[profile.release]
lto = true
codegen-units = 1
strip = true
